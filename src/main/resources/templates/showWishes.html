<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mine ønsker</title>
</head>
<body>
<h1>Ønsker</h1>

<ul>
    <li th:each="wish : ${wishes}">
        <strong th:text="${wish.name}"></strong>
        <p th:text="${wish.description}"></p>
        <p th:text="'Pris: ' + ${wish.price} + ' kr'"></p>
        <a th:href="${wish.link}" th:text="'Link til ønske'"></a>
        <p><br></p>
        <form action="/wish/delete" method="post">
            <input type="hidden" name="wishId" th:value="${wish.id}" />

            <button type="submit"
                    onclick="return confirm('Er du sikker på at du vil slette dette ønske?')">
                Slet ønske
            </button>
        </form>
        <hr>
    </li>
</ul>

<a th:href="@{/wish/create}">Tilføj Ønske</a>

</body>
</html>
