<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mine ønsker</title>
    <link rel="stylesheet" th:href="@{/headerStyle.css}">
    <link rel="stylesheet" th:href="@{/bodyStyle.css}">
    <link rel="stylesheet" th:href="@{/footerStyle.css}">
</head>
<body>
<header>
    <nav class="navbar">
        <div class="logo">
            <a th:href="@{/}">
                <img th:src="@{/img/Logo.png}" alt="logo">
            </a>
        </div>
        <div class="nav-links">
            <a th:href="@{/showWishlists}">Ønskesedler</a>
            <a th:href="@{/createWishlist}">Ny ønskeseddel</a>
            <a th:href="@{/profile}">Min profil</a>
            <a th:href="@{/logout}">Log ud</a>
        </div>
    </nav>
</header>

<main>
    <div class="container">
        <h1 class="page-title">Ønsker</h1>

        <div class="wish-card" th:each="wish : ${wishes}">
            <div>
                <h3 th:text="${wish.name}"></h3>
                <p th:text="${wish.description}"></p>
                <p th:text="'Pris: ' + ${wish.price} + ' kr.'"></p>
            </div>
            <div>
                <a th:if="${wish.link != null && !wish.link.isEmpty()}"
                   th:href="${wish.link}" target="_blank">Se link</a>
            </div>
            <div>
                <form th:if="${hasAccess && !isOwner && !@wishService.isWishReserved(wish.id)}"
                      th:action="@{/wish/reserve}" method="post">
                    <input type="hidden" name="wishId" th:value="${wish.id}">
                    <button type="submit">Reserver</button>
                </form>
                <span th:if="${hasAccess && !isOwner && @wishService.isWishReserved(wish.id)}">Reserveret</span>
            </div>
        </div>

        <div th:if="${isOwner}" class="profile-actions">
            <a th:href="@{/wish/create(wishlistId=${wishlistId})}" class="btn">Tilføj ønske</a>
            <a th:href="@{/wishlist/share(wishlistId=${wishlistId})}" class="btn">Del din ønskeseddel</a>
        </div>
    </div>
</main>
<footer>
    <div class="footer-container">

        <div class="footer-left">
            <div class="footer-title">Ønskeskyen</div>
            <div class="footer-text">Del dine ønsker nemt og hurtigt</div>
        </div>

        <div class="footer-links">
            <div th:if="${session.loggedInUser != null}">
                <a th:href="@{/showWishlists}">Ønskelister</a>
                <a th:href="@{/createWishlist}">Opret ønskeseddel</a>
                <a th:href="@{/profile}">Profil</a>
            </div>
        </div>

    </div>

    <div class="footer-bottom">
        Ønskeskyen
    </div>
</footer>
</body>
</html>
