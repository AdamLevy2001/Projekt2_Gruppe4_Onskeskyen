<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wishlists</title>
    <link rel="stylesheet" th:href="@{/HeaderStyle.css}">
</head>
<body>
<header>
    <nav class="navbar">
        <h1>Ønskeskyen</h1>

        <div class="nav-links">
            <a th:href="@{/showWishlists}">Ønskelister</a>
            <a th:href="@{/user/search}">Find brugere</a>
            <a th:href="@{/profile}">Profil</a>
            <a th:href="@{/logout}">Log ud</a>
        </div>
    </nav>
</header>

<main>
    <div class="container">
        <h1>Mine ønskesedler</h1>

        <div th:if="${wishlists.isEmpty()}" class="empty-message">
            <p>Du har ingen ønskesedler endnu. <a href="/createWishlist">Opret en</a></p>
        </div>

        <div th:if="${!wishlists.isEmpty()}" class="wishlist-container" th:each="wishlist : ${wishlists}">
            <h3><a th:href="@{/wish/show(id=${wishlist.id})}" th:text="${wishlist.name}"></a></h3>
            <p th:text="'ID: ' + ${wishlist.id}"></p>
            <a th:href="@{/getUpdateWishlist(id=${wishlist.id})}">Rediger</a>
            <form th:action="@{/deleteWishlist}" method="post">
                <input type="hidden" name="id" th:value="${wishlist.id}">
                <button type="submit" onclick="return confirm('Er du sikker på at du vil slette denne ønske?')">Slet</button>
            </form>
            <hr>
        </div>
        <h2>Delte ønskelister</h2>

        <div th:if="${sharedWishlists.isEmpty()}">
            <p>Ingen delte ønskelister</p>
        </div>

        <div th:each="wishlist : ${sharedWishlists}" class="shared-wishlist">
            <h3 th:text="${wishlist.name}"></h3>
            <p>Delt af: <span th:text="${wishlist.ownerName}"></span>
            </p>
            <a th:href="@{/wish/show(id=${wishlist.id})}">Se ønskeliste</a>
            <hr>
        </div>
    </div>
</main>

<footer>Blank</footer>
</body>
</html>
