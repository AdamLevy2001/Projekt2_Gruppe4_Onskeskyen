<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wishlists</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header>Blank</header>

<main>
    <div class="container">
        <div th:if="${wishlists.isEmpty()}" class="empty-message">
            <p>Du har ingen ønskesedler endnu. <a href="/createWishlist">Opret en</a></p>
        </div>

        <h1>Alle ønskesedler</h1>
        <hr>
        <div th:if="${!wishlists.isEmpty()}" class="wishlist-container" th:each="wishlist : ${wishlists}">
            <h3 th:text="${wishlist.name}"></h3>
            <a th:href="@{/wish/show(wishlistId=${wishlist.id})}">Se ønskeseddel</a>
            <hr>
        </div>
    </div>
</main>

<footer>Blank</footer>
</body>
</html>
