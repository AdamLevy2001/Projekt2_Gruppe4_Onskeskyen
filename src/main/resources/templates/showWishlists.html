<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wishlists</title>
    <link rel="stylesheet" th:href="@{/headerStyle.css}">
    <link rel="stylesheet" th:href="@{/bodyStyle.css}">
    <link rel="stylesheet" th:href="@{/footerStyle.css}">
    <link rel="stylesheet" th:href="@{globalStyle.css}">
</head>
<body>
<header>
    <nav class="navbar">

        <div class="logo">
            <a th:href="@{/}">
                <img th:src="@{/img/Logo.png}" alt="logo">
            </a>
        </div>

        <div class="nav-links">
            <a th:href="@{/showWishlists}">Ønskesedler</a>
            <a th:href="@{/createWishlist}">Ny ønskeseddel</a>
            <a th:href="@{/profile}">Min profil</a>
            <a th:href="@{/logout}">Log ud</a>
        </div>

    </nav>
</header>

<main>
    <div class="container">
        <h1 class="page-title">Mine ønskesedler</h1>

        <div th:if="${wishlists.isEmpty()}" class="empty-message">
            <p>Du har ingen ønskesedler endnu. <a href="/createWishlist">Opret en</a></p>
        </div>

        <div th:if="${!wishlists.isEmpty()}" class="wishlist-container" th:each="wishlist : ${wishlists}">
            <h3><a th:href="@{/wish/show(id=${wishlist.id})}" th:text="${wishlist.name}"></a></h3>
            <a th:href="@{/getUpdateWishlist(id=${wishlist.id})}">Rediger</a>
            <form th:action="@{/deleteWishlist}" method="post">
                <input type="hidden" name="id" th:value="${wishlist.id}">
                <button type="submit" onclick="return confirm('Er du sikker på at du vil slette denne ønske?')">Slet</button>
            </form>
        </div>

        <h2>Delte ønskesedler</h2>

        <div th:if="${sharedWishlists.isEmpty()}">
            <p>Ingen delte ønskelister</p>
        </div>

        <div th:each="wishlist : ${sharedWishlists}" class="shared-wishlist">
            <h3 th:text="${wishlist.name}"></h3>
            <p>Delt af: <span th:text="${wishlist.ownerName}"></span></p>
            <a th:href="@{/wish/show(id=${wishlist.id})}">Se ønskeseddel</a>
        </div>
    </div>
</main>

<footer>
    <div class="footer-container">

        <div class="footer-left">
            <div class="footer-title">Ønskeskyen</div>
            <div class="footer-text">Del dine ønsker nemt og hurtigt</div>
        </div>

        <div class="footer-links">
            <a th:href="@{/showWishlists}">Ønskelister</a>
            <a th:href="@{/createWishlist}">Opret ønskeseddel</a>
            <a th:href="@{/profile}">Profil</a>
        </div>

    </div>

    <div class="footer-bottom">
        Ønskeskyen
    </div>
</footer>
</body>
</html>
