<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/headerStyle.css}">
</head>
<body>
<header>
    <nav class="navbar">

        <div class="logo">
            <a th:href="@{/}">
                <img th:src="@{/img/Logo.png}" alt="logo">
            </a>
        </div>

        <div class="nav-links">
            <a th:href="@{/showWishlists}">Ønskesedler</a>
            <a th:href="@{/createWishlist}">Ny ønskeseddel</a>
            <a th:href="@{/profile}">Min profil</a>
            <a th:href="@{/logout}">Log ud</a>
        </div>

    </nav>
</header>
<main>
    <div class="container">
        <form th:action="@{/wish/create}" class="form-wrapper" method="post">
            <input type="hidden" name="wishlistId" th:value="${wishlistId}"/>
            <div class="createWishForm">
                <h2 class="form-title">Opret ønske</h2>

                <div th:if="${errorMessage}" class="error-message">
                    <p th:text="${errorMessage}"></p>
                </div>
                <div class="form-group">
                    <input type="text" id="name" name="name" th:value="${name}" placeholder=" " required>
                    <label for="name">Navn på ønske</label>
                </div>

                <div class="form-group">
                    <input type="text" id="description" name="description" th:value="${description}" placeholder=" ">
                    <label for="description">Beskrivelse (frivillig)</label>
                </div>

                <div class="form-group">
                    <input type="number" id="price" name="price" th:value="${price}" placeholder=" " required>
                    <label for="price">Pris</label>
                </div>

                <div class="form-group">
                    <input type="text" id="link" name="link" th:value="${link}" placeholder=" ">
                    <label for="link">Link (frivillig)</label>
                </div>

                <div class="button-wrapper">
                    <div class="form-actions">
                        <button type="submit" class="btn" id="btn-submit">Opret ønske</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</main>
<footer>
    Blank
</footer>
</body>
</html>
