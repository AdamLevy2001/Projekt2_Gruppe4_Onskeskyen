<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/createUserStyle.css}">
</head>
<body>
<header>Blank</header>

<main>
    <div class="container">
        <form class="form-wrapper" th:action="@{/login}" method="post">
            <div class="loginForm">
                <h2 class="form-title">Login</h2>
                <div th:if="${errorMessage}" class="error-message">
                    <p th:text="${errorMessage}"></p>
                </div>
                <div class="email-wrapper">
                    <div class="form-group">
                        <input type="email" id="email" name="email" value="hej2@hej.dk" placeholder=" " required>
                        <label for="email">Email</label>
                    </div>
                </div>

                <div class="password-wrapper">
                    <div class="form-group">
                        <input type="password" id="password" name="password" value="12345678" placeholder=" " required>
                        <label for="password">Password</label>
                    </div>
                </div>

                <div class="button-wrapper">
                    <div class="form-actions">
                        <button type="submit" class="btn" id="btn-submit">Login</button>
                    </div>
                </div>

                <p><a href="/createUser">Ingen bruger? Registrer her</a></p>
            </div>
        </form>
    </div>
</main>

<footer>Blank</footer>
</body>
</html>
