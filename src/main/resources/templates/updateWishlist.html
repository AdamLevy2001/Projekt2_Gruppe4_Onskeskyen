<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rediger Ønskeliste</title>
</head>
<body>
    <h1>Rediger Ønskeliste</h1>

    <form th:action="@{saveUpdateWishlist}" method="post">
        <input type="hidden" name="id" th:value="${wishlist.id}">

        <label for="name">Nyt navn</label>
        <input type="text" id="name" name="name" th:value="${wishlist.name}">

        <button type="submit">Gem ændringer</button>
    </form>

</body>
</html>
