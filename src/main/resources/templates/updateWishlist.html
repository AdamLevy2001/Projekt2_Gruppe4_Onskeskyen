<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rediger Ønskeliste</title>
    <link rel="stylesheet" th:href="@{/HeaderStyle.css}">
    <link rel="stylesheet" th:href="@{/createUserStyle.css}">
</head>
<body>
<header>
    <nav class="navbar">

        <div class="logo">
            <a th:href="@{/}">
                <img th:src="@{/img/Logo.png}" alt="logo">
            </a>
        </div>

        <div class="nav-links">
            <a th:href="@{/showWishlists}">Ønskelister</a>
            <a th:href="@{/user/search}">Find brugere</a>
            <a th:href="@{/profile}">Profil</a>
            <a th:href="@{/logout}">Log ud</a>
        </div>

    </nav>
</header>
<div class="container">
    <form class="form-wrapper" th:action="@{/saveUpdateWishlist}" method="post">
        <input type="hidden" name="id" th:value="${wishlist.id}">
        <div class="updateWishlistForm">
            <h2 class="form-title">Rediger Ønskeseddel</h2>
            <div class="form-group">
                <input type="text" id="name" name="name" th:value="${wishlist.name}" required>
                <label for="name">Nyt navn</label>
            </div>

            <div class="button-wrapper">
                <div class="form-actions">
                    <button type="submit" class="btn" id="btn-submit">Gem ændringer</button>
                </div>
            </div>
        </div>
    </form>
</div>

</body>
</html>
