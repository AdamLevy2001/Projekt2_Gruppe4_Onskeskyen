<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <link rel="stylesheet" th:href="@{/HeaderStyle.css}">
</head>
<body>

<header>

        <div class="logo">
            <a th:href="@{/}">
                <img th:src="@{/img/Logo.png}" alt="logo">
            </a>
        </div>

        <div class="nav-links">
            <a th:href="@{/showWishlists}">Ønskelister</a>
            <a th:href="@{/user/search}">Find brugere</a>

            <a th:href="@{/logout}">Log ud</a>
        </div>

    </nav>

<a th:href="@{/createUser}">Create User</a>

<div class="profile-info">

    <p><strong>Email:</strong> <span th:text="${session.email}"></span></p>

</html>
