<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ønskeskyen</title>
    <link rel="stylesheet" th:href="@{/HeaderStyle.css}">
</head>
<body>
<header>
    <nav class="navbar">
        <h1>Ønskeskyen</h1>
        <div class="nav-links">
            <div th:if="${session.loggedInUser}">
                <p th:text="'Logget ind som: ' + ${session.loggedInUser.name}"></p>
                <a th:href="@{/showWishlists}">Ønskesedler</a>
                <a th:href="@{/createWishlist}">Ny Ønskeseddel</a>
                <a th:href="@{/profile}">Min profil</a>
                <a th:href="@{/logout}">Log ud</a>
            </div>
            <div th:if="${session.loggedInUser == null}">
                <a th:href="@{/createUser}">Registrer</a>
                <a th:href="@{/login}">Login</a>
            </div>
        </div>
    </nav>
</header>

<main>
    <div th:if="${session.loggedInUser != null}">
        <h3>Profil</h3>
        <p><strong>Navn:</strong> <span th:text="${session.loggedInUser.name}"></span></p>
        <p><strong>Email:</strong> <span th:text="${session.loggedInUser.email}"></span></p>
        <p><strong>User ID:</strong> <span th:text="${session.loggedInUser.id}"></span></p>
    </div>
</main>

<footer>
    <p>Ønskeskyen</p>
</footer>
</body>
</html>
